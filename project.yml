name: SushiGarden
options:
  bundleIdPrefix: com.baha
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"

targets:
  SushiGarden:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SushiGarden
        excludes:
          - "DesignSystem/Fonts/**"
      - path: SushiGarden/DesignSystem/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAuth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baha.sushigarden
        INFOPLIST_FILE: SushiGarden/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO

  SushiGardenTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [SushiGardenTests]
    dependencies:
      - target: SushiGarden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baha.sushigarden.tests
        GENERATE_INFOPLIST_FILE: YES

  SushiGardenUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [SushiGardenUITests]
    dependencies:
      - target: SushiGarden
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baha.sushigarden.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SushiGarden:
    build:
      targets:
        SushiGarden: all
        SushiGardenTests: [test]
        SushiGardenUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SushiGardenTests
        - SushiGardenUITests
